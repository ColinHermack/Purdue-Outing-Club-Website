name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The seeded test database from docker-compose.test.yml (trust auth, no password). `next build`
      # prerenders pages that query it.
      DB_HOST: localhost
      DB_PORT: "5433"
      DB_USER: postgres
      DB_DATABASE: poc_test
      NEXTAUTH_URL: http://localhost:3000
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Start test database
        run: npm run test:db

      - name: Integration tests
        run: npm run test:integration

      - name: Build
        run: npm run build
